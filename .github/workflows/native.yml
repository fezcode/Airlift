name: Native build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, and publish
        shell: pwsh
        run: ./build.ps1 -Test -Publish -Runtime '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: airlift-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
