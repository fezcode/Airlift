[app]
name = "Airlift"
version = "0.2.3"
id = "com.fezcode.airlift"
icon = "native/Airlift.Desktop/Assets/airlift.ico"

[meta]
publisher = "Fezcode"
comments = "Your apps. In good hands."

[ui]
theme = "mica"
window_title = "Airlift Setup"

[install]
default_dir = "${LOCALAPPDATA}/Programs/Airlift"

[uninstall]
settings_dirs = ["${LOCALAPPDATA}/Fezcode/Airlift"]

[[steps]]
type = "welcome"
title = "A little lift for your everyday."
body = "Install Airlift to discover and manage your apps from public GitHub releases."

[[steps]]
type = "license"
title = "License Agreement"
body = "Please review the license terms below before continuing the installation."
file = "LICENSE.txt"

[[steps]]
type = "folder"
title = "Select Folder"
body = "Choose where to install Airlift."

[[steps]]
type = "shortcuts"
title = "Select Optional Tasks"
body = "Choose the shortcuts you would like the installer to create."

[[steps]]
type = "install"
title = "Installing..."
body = "Copying Airlift and its command-line companion to your computer."

[[steps]]
type = "finish"
title = "Installation Complete"
body = "Airlift has been installed successfully.\n\nClick Finish to close the installer."

[[steps.launches]]
kind = "app"
target = "${INSTALLDIR}/Airlift.exe"
label = "Open Airlift"
checked = true

[[dirs]]
src = "dist/win-x64/desktop"
dst = "${INSTALLDIR}"

[[dirs]]
src = "dist/win-x64/cli"
dst = "${INSTALLDIR}/cli"

[[shortcuts]]
target = "${INSTALLDIR}/Airlift.exe"
location = "${DESKTOP}/Airlift.lnk"
name = "Airlift"
app_id = "Fezcode.Airlift"
label = "Create Desktop Shortcut"
optional = true
default = true

[[shortcuts]]
target = "${INSTALLDIR}/Airlift.exe"
location = "${STARTMENU}/Airlift.lnk"
name = "Airlift"
app_id = "Fezcode.Airlift"
label = "Create Start Menu Entry"
optional = true
default = true


