[app]
name = "Airlift"
version = "0.3.1"
id = "com.fezcode.airlift"
icon = "native/Airlift.Desktop/Assets/airlift.ico"

[meta]
publisher = "Fezcode"
comments = "Your apps. In good hands."
homepage = "https://github.com/fezcode/Airlift"
support_url = "https://github.com/fezcode/Airlift/issues"

[ui]
theme = "mica"
window_title = "Airlift Setup"

[install]
default_dir = "${LOCALAPPDATA}/Programs/Airlift"

[uninstall]
settings_dirs = ["${LOCALAPPDATA}/Fezcode/Airlift"]

[[steps]]
type = "welcome"
title = "${app.name} ${app.version}"
body = "This wizard will install Airlift ${app.version} on your computer.\n\nDiscover, download and manage your apps from public GitHub releases.\n\nClick Next to continue."

[[steps]]
type = "license"
title = "License Agreement"
body = "Please review the license terms below before continuing the installation."
file = "LICENSE.txt"

[[steps]]
type = "folder"
title = "Select Folder"
body = "Choose where to install Airlift ${app.version}."

[[steps]]
type = "shortcuts"
title = "Select Shortcuts"
body = "Choose the shortcuts you would like the installer to create."

[[steps]]
type = "install"
title = "Installing..."
body = "Copying Airlift and its command-line companion to your computer."

[[steps]]
type = "finish"
title = "Installation Complete"
body = "Airlift has been installed successfully.\n\nClick Finish to close the installer."

[[steps.launches]]
kind = "app"
target = "${INSTALLDIR}/Airlift.exe"
label = "Open Airlift"
checked = true

[[dirs]]
src = "dist/win-x64/desktop"
dst = "${INSTALLDIR}"

[[dirs]]
src = "dist/win-x64/cli"
dst = "${INSTALLDIR}/cli"

[[shortcuts]]
target = "${INSTALLDIR}/Airlift.exe"
location = "${DESKTOP}/Airlift.lnk"
name = "Airlift"
app_id = "Fezcode.Airlift"
icon = "${INSTALLDIR}/airlift.ico"
label = "Create Desktop Shortcut"
optional = true
default = true

[[shortcuts]]
target = "${INSTALLDIR}/Airlift.exe"
location = "${STARTMENU}/Airlift.lnk"
name = "Airlift"
app_id = "Fezcode.Airlift"
icon = "${INSTALLDIR}/airlift.ico"
label = "Create Start Menu Entry"
optional = true
default = true

# Forge also writes the Windows Apps & Features uninstall record automatically.
# Keep app.id stable: that record is how Forge detects existing installations.
[[registry]]
hive = "HKCU"
key = 'Software\fezcode\Airlift'
value = "InstallDir"
data = "${INSTALLDIR}"

[[registry]]
hive = "HKCU"
key = 'Software\fezcode\Airlift'
value = "Version"
data = "${app.version}"

